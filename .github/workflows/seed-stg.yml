name: Seed staging

# 수동 실행 전용. 배포(deploy.yml)와 분리해 develop 푸시마다 돌지 않게 한다.
# 시드는 멱등(고정 UUID + on conflict do nothing)이라 여러 번 눌러도 안전하다.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed-stg
  cancel-in-progress: false

jobs:
  seed:
    name: Seed staging database
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # stg 고정 — 운영(prd)에는 이 워크플로로 절대 시드하지 않는다.
    environment:
      name: stg

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v2
        with:
          version: 2.109.1

      - name: Verify seed password is configured
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          if [ -z "$SEED_PASSWORD" ]; then
            echo "::error::SEED_PASSWORD 시크릿이 없습니다. stg 환경에 등록한 뒤 다시 실행하세요."
            exit 1
          fi

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      # 비밀번호는 파일에 남기지 않고 실행 직전에만 치환한다.
      # 치환 결과는 출력하지 않으며 스텝이 끝나면 러너와 함께 사라진다.
      - name: Render seed with password
        env:
          SEED_PASSWORD: ${{ secrets.SEED_PASSWORD }}
        run: |
          umask 077
          python3 - <<'PY'
          import os, pathlib
          src = pathlib.Path("supabase/seeds/stg-seed.sql").read_text(encoding="utf-8")
          out = src.replace("__SEED_PASSWORD__", os.environ["SEED_PASSWORD"])
          if "__SEED_PASSWORD__" in out:
              raise SystemExit("치환 실패: 자리표시자가 남아 있습니다")
          pathlib.Path("/tmp/stg-seed.rendered.sql").write_text(out, encoding="utf-8")
          print("렌더 완료")
          PY

      - name: Apply seed
        run: supabase db query --linked -f /tmp/stg-seed.rendered.sql

      - name: Clean up
        if: always()
        run: rm -f /tmp/stg-seed.rendered.sql
